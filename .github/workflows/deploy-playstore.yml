name: Build & Auto-Deploy to Google Play Console

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Project Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Install Bubblewrap CLI (Google TWA Builder)
        run: npm install -g @bubblewrap/cli

      - name: Decode Android Keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Initialize & Build Android App Bundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'docusync' }}
        run: |
          # Generate twa-manifest.json
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.gurudyal.docusync",
            "host": "ais-dev-ixe7pzjgijdmasggnzdnq7-623909174570.asia-southeast1.run.app",
            "name": "DocuSync",
            "launcherName": "DocuSync",
            "themeColor": "#0F172A",
            "navigationColor": "#0F172A",
            "backgroundColor": "#0F172A",
            "enableNotifications": true,
            "startUrl": "/",
            "iconUrl": "https://ais-dev-ixe7pzjgijdmasggnzdnq7-623909174570.asia-southeast1.run.app/icon.svg",
            "maskableIconUrl": "https://ais-dev-ixe7pzjgijdmasggnzdnq7-623909174570.asia-southeast1.run.app/icon.svg",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "signingKey": {
              "path": "./release.keystore",
              "alias": "docusync"
            }
          }
          EOF

          # Build the Android Bundle
          bubblewrap build --manifest=twa-manifest.json --skipPwaValidation

      - name: Upload .aab directly to Google Play Console
        if: env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.gurudyal.docusync
          releaseFiles: app-release-bundle.aab
          track: internal
          status: completed
