<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Main Document Stack Graphic -->
  <g transform="translate(106, 86)">
    <!-- Back page (tilted slightly) -->
    <rect x="30" y="10" width="220" height="300" rx="20" fill="rgba(255,255,255,0.08)" />

    <!-- Main White Document Card -->
    <rect x="0" y="30" width="240" height="320" rx="24" fill="#ffffff" filter="drop-shadow(0 20px 30px rgba(0,0,0,0.3))" />

    <!-- Document Fold Corner -->
    <path d="M 170 30 L 240 100 L 170 100 Z" fill="#e2e8f0" />
    <path d="M 170 30 L 240 100 L 240 30 Z" fill="#0f172a" />

    <!-- Header bar on document -->
    <rect x="32" y="70" width="100" height="18" rx="9" fill="url(#accentGrad)" />

    <!-- PDF Text Lines on document -->
    <rect x="32" y="120" width="176" height="12" rx="6" fill="#cbd5e1" />
    <rect x="32" y="146" width="150" height="12" rx="6" fill="#e2e8f0" />
    <rect x="32" y="172" width="164" height="12" rx="6" fill="#e2e8f0" />

    <!-- Red PDF Badge -->
    <rect x="32" y="215" width="80" height="32" rx="8" fill="#ef4444" />
    <text x="72" y="237" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle" letter-spacing="1">PDF</text>

    <!-- Photo/Scan Icon Badge on Card -->
    <circle cx="170" cy="231" r="24" fill="#3b82f6" />
    <path d="M 160 236 L 167 225 L 173 232 L 178 227 L 184 236 Z" fill="#ffffff" />
    <circle cx="166" cy="222" r="3" fill="#ffffff" />
  </g>

  <!-- Golden Sparkle Badge (Top Right) -->
  <path d="M 390 110 Q 400 130 420 140 Q 400 150 390 170 Q 380 150 360 140 Q 380 130 390 110 Z" fill="url(#goldGrad)" />
  <circle cx="350" cy="90" r="8" fill="#fbbf24" />
</svg>
